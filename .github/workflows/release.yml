name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            .output/*-chrome.zip .output/*-firefox.zip \
            --title "Margin $GITHUB_REF_NAME" \
            --notes "Download the zip for your browser and follow the [install steps in the README](https://github.com/${{ github.repository }}#from-a-release): \`-chrome.zip\` for Chrome, Edge, Brave, Opera and other Chromium browsers, \`-firefox.zip\` for Firefox." \
            --generate-notes
